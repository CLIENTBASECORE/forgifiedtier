# Divisions Configuration
# You can customize the chat format and the divisions here.
# <division> is the player's division string.
# <format> is the original chat format (from EssentialsChat/LPC).

# Current Format (per user request: no separator)
chat-format: "<division> <format>"

# Define your divisions based on unranked wins
# Colors:
# Iron: &8 (Dark Gray)
# Bronze: &c (Red) or &4 (Dark Red) - Let's use &6 (Gold/Orange-ish) for Bronze feel? No, &c/&4 is more typical. 
# Actually let's use:
# Iron: &8
# Bronze: &6
# Silver: &f
# Gold: &e
# Platinum: &3
# Diamond: &b
# Master: &d
# Grandmaster: &c
# Global Elite: &4
