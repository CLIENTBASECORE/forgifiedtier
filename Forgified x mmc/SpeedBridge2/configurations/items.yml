join-game:
    items:
    -   index: 7
        item:
            material: INK_SACK
            durability: 1
            meta:
                display_name: <yellow>Reset
                lore:
                - <gray>Click to reset the game!
        action:
            type: PERFORM_COMMAND
            run_command: RESET_ISLAND
    -   index: 8
        item:
            material: BED
            durability: 0
            meta:
                display_name: <yellow>Leave
                lore:
                - <gray>Click to leave the game!
        action:
            type: PERFORM_COMMAND
            run_command: sb leave
