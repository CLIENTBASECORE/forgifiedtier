# VoidLevel configuration
# Per-world settings are stored under void-levels.<worldName>
void-levels:
  world: 0

# How much damage to apply when a player reaches or goes below the void level
damage:
  amount: 4.0
  mode: damage # options: "damage" (applies damage amount), "kill" (instantly kill player)

# Performance: how many chunks to process per server tick (lower = less lag but slower)
performance:
  chunks-per-tick: 1

# Logging
debug: false
