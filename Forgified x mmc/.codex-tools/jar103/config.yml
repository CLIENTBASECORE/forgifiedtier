respawn-delay-seconds: 3
force-respawn-after-ticks: 2
pseudo-death:
  enabled: true
  apply-to-any-frost-fight-if-kit-unknown: true
  lock-after-damage-ticks: 6
  teleport-detection-window-millis: 4000
anti-frost-teleport:
  enabled: true
  after-release-ticks: 40
  max-distance-from-respawn: 1.5
target-kits:
  - FireballFight
  - BedFight
  - BattleRush
  - StickFight
  - PearlFight
messages:
  countdown-title: "&bRespawning"
  countdown-subtitle: "&7You can move in &b<seconds>&7..."
  released-title: "&aGo!"
  released-subtitle: "&7You have respawned."
chat-filter:
  enabled: true
  cooldown-millis: 2500
